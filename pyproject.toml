[project]
name = "altdata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wael Sabri", email = "waelsabri4@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
altdata = "altdata:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
